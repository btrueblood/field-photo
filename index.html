<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Photo">
<meta name="theme-color" content="#1a1f26">
<link rel="apple-touch-icon" href="icon.png">
<title>Farwest Field Photo</title>
<style>
  :root{
    --bg:#1a1f26; --panel:#242b35; --panel2:#2d3644; --text:#f2f5f8; --dim:#9aa7b5;
    --accent:#f28c28; --accent-press:#d97a1a; --green:#3fa860; --red:#c0392b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior:none;}
  body{display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;}

  header{padding:calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px 18px;
    background:var(--panel); display:flex; align-items:center; justify-content:space-between;}
  header .brand{font-size:19px; font-weight:700; letter-spacing:.3px;}
  header .brand span{color:var(--accent);}
  #offlineBadge{font-size:12px; color:var(--dim); border:1px solid #3a4553; border-radius:20px;
    padding:3px 10px; display:none;}
  #offlineBadge.ready{display:inline-block; color:#7fc796; border-color:#3f6b50;}

  main{flex:1; display:flex; flex-direction:column; padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 16px) 18px;
    width:100%; max-width:820px; margin:0 auto;}

  .screen{display:none; flex-direction:column; gap:14px; flex:1;}
  .screen.active{display:flex;}

  label{font-size:13px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.6px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  input[type=text], textarea{
    background:var(--panel); color:var(--text); border:1px solid #3a4553; border-radius:var(--radius);
    padding:14px 14px; font-size:17px; width:100%; outline:none;}
  input[type=text]:focus, textarea:focus{border-color:var(--accent);}
  .row{display:flex; gap:12px;}
  .row .field{flex:1;}

  button{border:none; border-radius:var(--radius); font-size:18px; font-weight:700; padding:16px;
    cursor:pointer; color:#fff; width:100%;}
  button:active{transform:scale(.99);}
  .btn-primary{background:var(--accent); color:#20160a; font-size:21px; padding:20px;}
  .btn-primary:active{background:var(--accent-press);}
  .btn-secondary{background:var(--panel2); color:var(--text); font-weight:600;}
  .btn-save{background:var(--green); font-size:21px; padding:18px;}
  .btn-ghost{background:transparent; color:var(--dim); font-weight:600; font-size:15px; padding:10px;}

  .hint{font-size:14px; color:var(--dim); line-height:1.45; text-align:center;}
  .hint .mic{font-size:16px;}

  #previewWrap{background:#000; border-radius:var(--radius); overflow:hidden; display:flex;
    align-items:center; justify-content:center; max-height:44vh;}
  #previewWrap canvas{max-width:100%; max-height:44vh; display:block;}

  #descBox{min-height:110px; resize:none; line-height:1.4;}

  #toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    transform:translateX(-50%); background:var(--green); color:#fff; font-weight:700;
    padding:14px 22px; border-radius:30px; font-size:16px; display:none; z-index:50;
    box-shadow:0 6px 18px rgba(0,0,0,.4); text-align:center; max-width:88vw;}

  footer{padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 10px) 18px; text-align:center;
    font-size:12px; color:#5d6b7a;}

  .spacer{flex:1;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  #savingNote{display:none; text-align:center; color:var(--dim); font-size:15px;}
</style>
</head>
<body>
<header>
  <div class="brand">Farwest <span>Field Photo</span></div>
  <div id="offlineBadge">offline ready ✓</div>
</header>

<main>
  <!-- SCREEN 1: setup + take photo -->
  <section id="screen-home" class="screen active">
    <div class="row">
      <div class="field">
        <label for="job">Job name / number</label>
        <input type="text" id="job" placeholder="e.g. 26-114 TSMC" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="field">
        <label for="who">Your name</label>
        <input type="text" id="who" placeholder="e.g. Brenden" autocomplete="off" autocapitalize="words">
      </div>
    </div>

    <div class="spacer"></div>

    <div class="stack">
      <button class="btn-primary" id="btnTake">📷 &nbsp;Take Photo</button>
      <button class="btn-secondary" id="btnPick">Annotate an existing photo…</button>
      <p class="hint">Snap the issue, then talk your description in.<br>Everything stays on this iPad.</p>
    </div>

    <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="libInput" accept="image/*" hidden>
  </section>

  <!-- SCREEN 2: describe + save -->
  <section id="screen-annotate" class="screen">
    <div id="previewWrap"><canvas id="previewCanvas"></canvas></div>

    <div class="field">
      <label for="descBox">Description of the issue</label>
      <textarea id="descBox" placeholder="Tap here, then tap the mic 🎤 on the keyboard and just talk."></textarea>
      <p class="hint"><span class="mic">🎤</span> The mic key on the iPad keyboard does the dictation — it works even with no service.</p>
    </div>

    <div class="stack">
      <button class="btn-save" id="btnSave">Stamp &amp; Save to Photos</button>
      <p id="savingNote">Preparing photo…</p>
      <button class="btn-ghost" id="btnRetake">← Retake / cancel</button>
    </div>
  </section>
</main>

<div id="toast"></div>
<footer>Farwest Field Photo v1.0.0 — photos never leave this device</footer>

<canvas id="workCanvas" hidden></canvas>

<script>
'use strict';
const APP_VERSION = '1.0.0';

const $ = id => document.getElementById(id);
const screens = { home: $('screen-home'), annotate: $('screen-annotate') };
let currentBitmap = null;   // ImageBitmap or HTMLImageElement
let bmpW = 0, bmpH = 0;

/* ---------- settings persistence (best-effort) ---------- */
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
$('job').value = lsGet('fp_job');
$('who').value = lsGet('fp_who');
$('job').addEventListener('input', e => lsSet('fp_job', e.target.value));
$('who').addEventListener('input', e => lsSet('fp_who', e.target.value));

/* ---------- navigation ---------- */
function show(name){
  for (const k in screens) screens[k].classList.toggle('active', k === name);
  window.scrollTo(0,0);
}

/* ---------- capture ---------- */
$('btnTake').addEventListener('click', () => $('camInput').click());
$('btnPick').addEventListener('click', () => $('libInput').click());
$('camInput').addEventListener('change', onFile);
$('libInput').addEventListener('change', onFile);

async function onFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';               // allow re-selecting the same file
  if (!file) return;
  try {
    currentBitmap = await decodeImage(file);
  } catch(err){
    toast('Could not read that photo. Try again.', true);
    return;
  }
  bmpW = currentBitmap.width || currentBitmap.naturalWidth;
  bmpH = currentBitmap.height || currentBitmap.naturalHeight;
  drawPreview();
  $('descBox').value = '';
  show('annotate');
}

function decodeImage(file){
  // Prefer createImageBitmap with EXIF orientation honored; fall back to <img>.
  if (window.createImageBitmap){
    return createImageBitmap(file, { imageOrientation: 'from-image' })
      .catch(() => createImageBitmap(file))
      .catch(() => imgFallback(file));
  }
  return imgFallback(file);
}
function imgFallback(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function drawPreview(){
  const c = $('previewCanvas');
  const maxW = 1200;                          // preview only; full res kept for save
  const scale = Math.min(1, maxW / bmpW);
  c.width  = Math.round(bmpW * scale);
  c.height = Math.round(bmpH * scale);
  c.getContext('2d').drawImage(currentBitmap, 0, 0, c.width, c.height);
}

$('btnRetake').addEventListener('click', () => { currentBitmap = null; show('home'); });

/* ---------- stamping ---------- */
function fmtNow(){
  const d = new Date();
  const date = d.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' });
  const time = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  return date + '  ' + time;
}

function wrapText(ctx, text, maxWidth){
  const out = [];
  for (const rawLine of text.split('\n')){
    const words = rawLine.split(/\s+/).filter(Boolean);
    if (!words.length){ continue; }
    let line = words[0];
    for (let i = 1; i < words.length; i++){
      const test = line + ' ' + words[i];
      if (ctx.measureText(test).width <= maxWidth) line = test;
      else { out.push(line); line = words[i]; }
    }
    out.push(line);
  }
  return out;
}

function renderStamped(){
  const c = $('workCanvas');
  c.width = bmpW; c.height = bmpH;
  const ctx = c.getContext('2d');
  ctx.drawImage(currentBitmap, 0, 0);

  const desc = $('descBox').value.trim();
  const job  = $('job').value.trim();
  const who  = $('who').value.trim();
  const headerParts = [];
  if (job) headerParts.push('JOB ' + job);
  if (who) headerParts.push(who);
  headerParts.push(fmtNow());
  const header = headerParts.join('   •   ');

  // Fit loop: shrink font until the bar takes at most ~45% of image height.
  let base = Math.max(22, Math.round(bmpW / 42));
  const minBase = Math.max(15, Math.round(bmpW / 95));
  let pad, headerSize, lineH, lines, barH;
  for (;;){
    pad = Math.round(base * 0.75);
    headerSize = Math.round(base * 0.72);
    lineH = Math.round(base * 1.32);
    ctx.font = '600 ' + base + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    lines = desc ? wrapText(ctx, desc, bmpW - pad * 2) : [];
    barH = pad + headerSize + (lines.length ? Math.round(base * 0.55) + lines.length * lineH : 0) + pad;
    if (barH <= bmpH * 0.45 || base <= minBase) break;
    base = Math.max(minBase, Math.round(base * 0.88));
  }

  const top = bmpH - barH;
  ctx.fillStyle = 'rgba(10, 12, 15, 0.72)';
  ctx.fillRect(0, top, bmpW, barH);
  ctx.fillStyle = 'rgba(242, 140, 40, 1)';
  ctx.fillRect(0, top, bmpW, Math.max(3, Math.round(bmpH * 0.004)));

  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.font = '700 ' + headerSize + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  ctx.fillText(header, pad, top + pad, bmpW - pad * 2);

  ctx.fillStyle = '#ffffff';
  ctx.font = '600 ' + base + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  let y = top + pad + headerSize + Math.round(base * 0.55);
  for (const line of lines){ ctx.fillText(line, pad, y); y += lineH; }
  return c;
}

/* ---------- save ---------- */
function makeFilename(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const stamp = d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  const job = $('job').value.trim().replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '');
  return (job ? job + '_' : '') + 'issue_' + stamp + '.jpg';
}

$('btnSave').addEventListener('click', async () => {
  if (!currentBitmap) return;
  const btn = $('btnSave');
  btn.disabled = true;
  $('savingNote').style.display = 'block';
  try {
    const canvas = renderStamped();
    const blob = await new Promise((res, rej) =>
      canvas.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', 0.92));
    const file = new File([blob], makeFilename(), { type: 'image/jpeg' });

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file] });
        finishSave();
      } catch(err){
        // User cancelled the share sheet — stay on this screen, nothing lost.
      }
    } else {
      // Desktop / fallback: download the file.
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      finishSave();
    }
  } catch(err){
    toast('Something went wrong saving — try again.', true);
  } finally {
    btn.disabled = false;
    $('savingNote').style.display = 'none';
  }
});

function finishSave(){
  currentBitmap = null;
  show('home');
  toast('Stamped ✓ — pick “Save Image” to put it in Photos');
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, isError){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4200);
}

/* ---------- offline (service worker) ---------- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const mark = () => $('offlineBadge').classList.add('ready');
      if (reg.active) mark(); else navigator.serviceWorker.ready.then(mark);
    }).catch(() => {});
  });
}
</script>
</body>
</html>
